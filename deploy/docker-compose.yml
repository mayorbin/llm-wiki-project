# deploy/docker-compose.yml
version: '3.8'
services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    environment:
      - LLM_WIKI_LLM_API_KEY=${LLM_WIKI_LLM_API_KEY}
      - LLM_WIKI_SECRET_KEY=${LLM_WIKI_SECRET_KEY}
      - LLM_WIKI_LLM_API_BASE=${LLM_WIKI_LLM_API_BASE:-http://llm:8000/v1}
      - LLM_WIKI_DATA_DIR=/data
    volumes:
      - wiki_data:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wiki_data:
