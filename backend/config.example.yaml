# LLM Wiki 配置模板 —— 复制为 config.yaml 后修改
app_name: "LLM Wiki"
debug: false
log_level: "INFO"
data_dir: "./data"

llm:
  provider: "openai_compatible"
  model: "deepseek/deepseek-v4-flash"
  api_base: "http://localhost:8000/v1"
  api_key: "${LLM_WIKI_LLM_API_KEY}"
  temperature: 0.3
  max_tokens: 8192
  extra_headers: {}

service:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  secret_key: "${LLM_WIKI_SECRET_KEY}"

security:
  max_upload_size_mb: 100
  cors_origins:
    - "http://localhost:5173"
  registration_open: false

retention:
  snapshot_days: 30
  task_history_days: 7
  log_days: 90
